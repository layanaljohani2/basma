<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بصمة · BASMA — منصة تجريبية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6f5;--card:#fff;--ink:#10201f;--muted:#5d6f6d;--line:#dfe8e6;--dark:#0b2a2a;--teal:#0f6b63;--teal2:#138a7f;--tealbg:#e4f2ef;--orange:#e8774a;--red:#c8453b;--redbg:#fbe9e7;--amber:#b9800f;--amberbg:#fdf3dc;--green:#2f8f5b;--greenbg:#e5f4ea;--violet:#5b4fb5;--violetbg:#f1effb;--r:14px}
*{box-sizing:border-box}
body{margin:0;font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
button,input,textarea,select{font:inherit;color:inherit}
.top{background:var(--dark);color:#fff;position:sticky;top:0;z-index:20}
.top-in{max-width:1220px;margin:auto;padding:12px 20px 0}
.top-row{display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:8px;color:#fff;text-decoration:none;font-weight:700;font-size:24px}
.badge-demo{margin-inline-start:auto;border:1px solid #ffffff55;border-radius:999px;padding:4px 14px;font-size:13px;color:#e6f0ee}
nav{display:flex;gap:2px;overflow-x:auto;margin-top:8px;scrollbar-width:none}
nav a{color:#cfe3e0;text-decoration:none;padding:10px 16px;font-size:15px;white-space:nowrap;border-bottom:3px solid transparent}
nav a.on{color:#fff;font-weight:700;border-color:#2fb3a5}
nav a:hover{color:#fff}
main{max-width:1220px;margin:auto;padding:24px 20px 70px}
h1,h2,h3,h4{margin:0 0 6px;line-height:1.35}
h1{font-size:30px}h2{font-size:22px}h3{font-size:17px}h4{font-size:15px}
.muted{color:var(--muted)}.note{font-size:13px;color:var(--muted)}
.eyebrow{color:var(--teal);font-weight:600;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(330px,100%),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.btn{border:0;border-radius:10px;padding:9px 16px;background:var(--teal);color:#fff;font-weight:600;cursor:pointer;font-size:14px}
.btn:hover{background:#0c5a53}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--teal);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--teal)}
.btn.dark{background:var(--dark)}
.btn.sm{padding:5px 12px;font-size:13px}
.btn.red{background:var(--red)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 13px;cursor:pointer;font-size:14px}
.chip.on{background:var(--tealbg);border-color:var(--teal);color:var(--teal);font-weight:600}
.chip.on::before{content:"✓ "}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.seg button{border:0;background:#fff;padding:6px 12px;cursor:pointer;font-size:13px}
.seg button+button{border-inline-start:1px solid var(--line)}
.seg button.on{background:var(--tealbg);color:var(--teal);font-weight:700}
.seg button.on-s{background:var(--greenbg);color:var(--green);font-weight:700}
.seg button.on-c{background:var(--redbg);color:var(--red);font-weight:700}
label.f{display:block;font-weight:600;font-size:14px;margin:12px 0 5px}
input[type=text],input[type=number],textarea,select{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:#fff}
input:focus,textarea:focus,select:focus{outline:2px solid #9fd3cb;border-color:var(--teal)}
textarea{min-height:56px;resize:vertical}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.p-red{background:var(--redbg);color:var(--red)}.p-amber{background:var(--amberbg);color:var(--amber)}.p-green{background:var(--greenbg);color:var(--green)}.p-teal{background:var(--tealbg);color:var(--teal)}.p-gray{background:#eef1f1;color:#5d6f6d}.p-violet{background:var(--violetbg);color:var(--violet)}
.src{display:inline-block;font-size:11px;border-radius:6px;padding:1px 7px;background:#eef1f1;color:#5d6f6d;margin-inline-start:4px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-weight:600;color:var(--muted);text-align:right;padding:9px 10px;border-bottom:1px solid var(--line);font-size:13px;background:#f7faf9}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr.click{cursor:pointer}tr.click:hover td{background:#f4faf8}tr.sel td{background:#eaf5f2}
.res{border-radius:12px;padding:12px 14px;border:1px solid}
.res.red{background:var(--redbg);border-color:#efc3bd;color:#7d2a22}
.res.amber{background:var(--amberbg);border-color:#f0dba6;color:#6d4c08}
.res.green{background:var(--greenbg);border-color:#bfe3cc;color:#1d5d3a}
.res.gray{background:#f4f6f6;border-color:var(--line);color:var(--muted)}
.res b.t{font-size:17px;display:block}
.res b.t::before{content:"● "}
.hero{background:linear-gradient(160deg,#2b5f66 0%,#163a3d 55%,#0d2526 100%);color:#fff;border-radius:20px;padding:36px;position:relative;overflow:hidden}
.hero h1{font-size:50px}
.hero .sub{color:var(--orange);font-size:21px;font-weight:600}
.hero p{color:#c9dcd9;max-width:680px}
.hero .fp{position:absolute;inset-inline-end:30px;top:30px;opacity:.12}
.path{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.path .st{border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;background:#fff}
.path .st:hover{border-color:var(--teal)}
.path .st small{color:var(--teal);font-weight:600;font-size:11px}
.path .st b{display:block;font-size:14px}
.av{width:42px;height:42px;border-radius:50%;background:var(--tealbg);color:var(--teal);display:grid;place-items:center;font-weight:700;flex:none}
.stepper{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.stepper button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px 5px 14px;cursor:pointer;font-size:14px;display:flex;align-items:center;gap:6px}
.stepper button i{font-style:normal;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;background:#eef1f1}
.stepper button.on{background:var(--dark);color:#fff;border-color:var(--dark)}
.stepper button.on i{background:#fff;color:var(--dark)}
.stepper button.done i{background:var(--teal);color:#fff}
.ic{font-size:16px;margin-inline-end:4px}
.hcard{background:#fff8ec;border-color:#f3d9a8}
.pcard{background:#f6f5fd;border-color:#dcd8f3}
.kv{display:grid;grid-template-columns:150px 1fr;gap:4px 12px;font-size:14px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.tl{list-style:none;padding:0;margin:0}
.tl li{display:flex;gap:10px;padding:4px 0;font-size:14px}
.tl li::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--teal);margin-top:7px;flex:none;box-shadow:0 0 0 3px var(--tealbg)}
.tl time{font-weight:700;color:var(--teal);flex:none}
.phone{background:#fff;border:10px solid var(--dark);border-radius:34px;padding:16px;max-width:430px;margin:auto}
.board-grid{display:grid;grid-template-columns:1fr 120px 1fr;gap:8px;align-items:center}
.bbtn{display:block;width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px;margin:6px 0;cursor:pointer;font-size:14px}
.bbtn.on{background:var(--tealbg);border-color:var(--teal);font-weight:700}
.faces{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.face{border:1px solid var(--line);border-radius:10px;background:#fff;padding:6px 2px;cursor:pointer;font-size:11px;text-align:center}
.face.on{border-color:var(--teal);background:var(--tealbg);font-weight:700}
.wants{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
svg .reg{fill:#e8eeed;stroke:#b8c9c6;stroke-width:1.5}
svg .reg.on{fill:#f2a08a;stroke:var(--red)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;padding:10px 18px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none;z-index:50;max-width:90vw}
.toast.show{opacity:1}
.code{background:#0d2222;color:#d6efe9;border-radius:12px;padding:14px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;max-height:520px;overflow:auto;direction:ltr;text-align:left;white-space:pre;margin:0}
.dash{display:grid;grid-template-columns:190px 1fr;gap:0;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#fff}
.dash aside{background:var(--dark);color:#cfe3e0;padding:18px 12px}
.dash aside a{display:flex;justify-content:space-between;padding:8px 10px;border-radius:8px;color:#cfe3e0;text-decoration:none;font-size:14px;cursor:pointer}
.dash aside a.on,.dash aside a:hover{background:#ffffff14;color:#fff}
.dash aside .n{background:var(--red);color:#fff;border-radius:999px;font-size:11px;padding:0 7px}
.dash .in{padding:18px;background:var(--bg)}
.kpi b{font-size:30px;display:block;line-height:1.2}
.kpi.red b{color:var(--red)}.kpi.amber b{color:var(--amber)}
.alert{border-inline-start:4px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;font-size:13px;margin-bottom:8px}
.alert.red{border-color:var(--red)}.alert.amber{border-color:#e3b13b}.alert.green{border-color:var(--green)}.alert.gray{border-color:#b9c7c5}.alert.violet{border-color:var(--violet)}
.due-late{background:var(--amberbg);color:var(--amber);font-weight:700;border-radius:6px;padding:1px 6px}
.bar{height:8px;border-radius:9px;background:#eef1f1;position:relative;overflow:hidden}
.bar span{position:absolute;inset-inline-start:0;top:0;bottom:0;border-radius:9px}
.doc{background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px;max-width:860px}
.doc h3{color:var(--teal);margin-top:18px}
.progress{height:8px;background:#e6eceb;border-radius:9px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--teal);transition:width .3s}
.sec-h{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.sec-h .n{width:24px;height:24px;border-radius:50%;background:var(--tealbg);color:var(--teal);display:grid;place-items:center;font-size:12px;font-weight:700}
.split{display:grid;gap:14px;grid-template-columns:minmax(0,2.2fr) minmax(250px,1fr);align-items:start}
.split2{display:grid;gap:14px;grid-template-columns:minmax(280px,1fr) minmax(0,1.5fr);align-items:start}
.dtable{min-width:560px}
.chk::before{content:"";display:inline-block;width:14px;height:14px;border:1.5px solid #9fb6b2;border-radius:4px;margin-inline-end:6px;vertical-align:-2px;background:#fff}
.chk.on::before{content:"✓";background:var(--teal);border-color:var(--teal);color:#fff;font-size:11px;line-height:14px;text-align:center}
.chip.chk.on::before{content:"✓"}
.ftabs{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:10px}
.ftabs button{border:0;background:#fff;padding:8px 18px;cursor:pointer}
.ftabs button.on{background:var(--tealbg);color:var(--teal);font-weight:700}
.dashed{border-style:dashed}
.stepper{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.stepper button{white-space:nowrap;flex:none}
@media(max-width:860px){.split,.split2{grid-template-columns:1fr}.g4{grid-template-columns:1fr 1fr}
 .ctab thead{display:none}.ctab tr{display:block;border-bottom:1px solid var(--line);padding:8px 0}.ctab td{display:block;border:0;padding:3px 0}.ctab td:first-child{font-size:15px}
 h1{font-size:24px}main{padding:16px 14px 60px}.hero{padding:22px}.dash .in{padding:12px}}
@media(max-width:860px){.dash{grid-template-columns:1fr}.dash aside{display:flex;flex-wrap:wrap;gap:4px}.hero h1{font-size:38px}.kv{grid-template-columns:1fr}.board-grid{grid-template-columns:1fr 100px 1fr}}
</style>
</head>

<script>
/* ================= ثوابت ================= */
const DOM=[['face','تعابير الوجه'],['move','الحركة'],['voice','الأصوات'],['touch','الاستجابة للمس'],['social','التفاعل'],['sleep','النوم'],['eat','الأكل']];
const PAIN_OPTS=['أنين متكرر','بكاء أو صراخ','يمسك المكان المؤلم','يتقوّس ظهره أو يتيبّس جسمه','يغمض عينيه بقوة','يقل نشاطه','تقطيب الوجه','ينعزل عن أسرته','يرفض الأكل','يضرب رأسه أو يعض يده','يستيقظ كثيرًا ليلًا','تزيد حركته أو يهيج'];
const REGIONS=[['head','الرأس'],['mouth','الأسنان والفم'],['ear','الأذن'],['chest','الصدر'],['abd','البطن'],['back','الظهر'],['hand','اليد'],['leg','الرجل']];
const FACES=[['ما يوجع','#2f9e5b'],['يوجع شوي','#8bbf3c'],['يوجع','#e8c23a'],['يوجع كثير','#ec8a2f'],['يوجع كثير جدًا','#d9443a']];
const WANTS=[['💧','ماء'],['🚻','حمام'],['🍽️','أكل'],['🛏️','نوم']];
const OPQ=[['onset','البداية'],['loc','الموقع'],['nature','الطبيعة'],['radiate','الانتشار'],['worse','ما يزيده'],['better','ما يخففه'],['assoc','الأعراض المصاحبة'],['sev','الشدة']];
const KEY='basma-demo-v3';

/* ================= أدوات ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MIN=60000;
const hm=t=>{if(!t)return '—';const d=new Date(t);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const ago=m=>Date.now()-m*MIN;
function fmtDate(t){try{return new Date(t).toLocaleDateString('ar-SA-u-ca-gregory-nu-latn',{day:'numeric',month:'long',year:'numeric'})}catch(e){return ''}}
function monthsSince(t){const a=new Date(t),b=new Date();return (b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth())}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2400)}
function copyText(txt,msg){try{navigator.clipboard.writeText(txt).then(()=>toast(msg||'تم النسخ'),()=>toast('تعذّر النسخ، حدّدي النص وانسخيه'))}catch(e){toast('تعذّر النسخ، حدّدي النص وانسخيه')}}

/* ================= البيانات الافتراضية ================= */
function emptyCard(){return {comm:{speaks:false,sign:false,pictures:false,points:false,refuse:''},pain:[],painOther:'',base:{face:'',move:'',voice:'',touch:'',social:'',sleep:'',eat:''},handle:{upset:'',beforeTouch:'',comfort:''},med:{cond:'',recur:'',allergy:''},video:false,companion:'',consent:false,updated:null,by:'',temp:false}}
function emptyVisit(arr){return {arrived:arr||Date.now(),cmp:{},cmpStart:null,cmpSecs:null,cmpSaved:null,q:{express:null,acute:true},score:'',board:{loc:[],sev:null,wants:[]},painSaved:null,opq:{},hidden:[],hiddenSaved:false,interv:null,due:null,after:{},afterScore:'',reassessed:null,finalCause:'',episodeSaved:false,closed:false,history:[],tl:[]}}
function mkCmp(changed){const o={};DOM.forEach(([k])=>o[k]={s:'same'});Object.entries(changed).forEach(([k,v])=>o[k]={s:'changed',n:v.n||'',m:!!v.m});return o}
function seed(){
  const saadCard={comm:{speaks:false,sign:true,pictures:true,points:true,refuse:'يرفض بهز رأسه، ويبتعد إذا خاف.'},
    pain:['أنين متكرر','يمسك المكان المؤلم','يقل نشاطه','يغمض عينيه بقوة'],painOther:'',
    base:{face:'هادئ، ويبتسم لأسرته',move:'كثير الحركة ويحرك يديه باستمرار',voice:'هادئ أثناء الراحة',touch:'يتقبل اللمس',social:'يتفاعل مع أسرته',sleep:'يستيقظ ليلًا مرتين',eat:'شهيته جيدة'},
    handle:{upset:'الصوت العالي والإضاءة القوية',beforeTouch:'كلّميه وأريه يدك أولًا',comfort:'وجود والدته والإضاءة الخافتة'},
    med:{cond:'صرع مسيطر عليه بالأدوية',recur:'إمساك متكرر',allergy:'لا يوجد'},video:true,companion:'والدته',consent:true,updated:new Date('2026-09-03').getTime(),by:'والدته',temp:false};
  const card=(o)=>Object.assign(emptyCard(),o);
  const P=[
   {id:'1012345678',mrn:'10482',name:'سعد',age:24,sex:'ذكر',dx:'إعاقة فكرية',bed:7,card:saadCard,
    diary:[{t:'السبت 14:00',x:'أنين من الصباح، ويرفض لمس بطنه.',src:'الأسرة'},{t:'الجمعة 13:00',x:'أكل نصف وجبته فقط.',src:'الأسرة'},{t:'الخميس 12:00',x:'أقل تفاعلًا في الجلسة، ولم يتبرز منذ الثلاثاء.',src:'مركز التأهيل'}],
    diarySum:'تغيّر بدأ قبل 3 أيام: نوم أقل، ثم أكل أقل، ولم يتبرز منذ 4 أيام',
    episodes:[{date:'مارس 2026',cause:'إمساك',signs:'قلة الحركة ويمسك بطنه'}],v:emptyVisit()},
   {id:'1023456789',mrn:'20517',name:'ريم',age:9,sex:'أنثى',dx:'شلل دماغي وإعاقة عصبية شديدة',bed:4,
    card:card({comm:{speaks:false,sign:false,pictures:false,points:false,refuse:'تبكي وتدير وجهها'},pain:['بكاء أو صراخ','يضرب رأسه أو يعض يده','يستيقظ كثيرًا ليلًا'],
      base:{face:'تعابير قليلة',move:'تتحرك بكرسي متحرك، وتشد يديها أحيانًا',voice:'تصدر أصواتًا عالية عند الفرح',touch:'تنزعج من لمس القدمين',social:'تحب الأغاني وتلتفت لها',sleep:'نومها متقطع عادة',eat:'تأكل بالملعقة ببطء'},
      handle:{upset:'الأصوات المفاجئة',beforeTouch:'نادِ اسمها قبل لمسها',comfort:'أغنية معينة على جوال والدتها'},med:{cond:'شلل دماغي، صرع',recur:'ارتجاع',allergy:'البنسلين'},video:true,companion:'والدتها',consent:true,updated:new Date('2026-05-11').getTime(),by:'والدتها'}),

  p.episodes=(p.episodes||[]).filter(x=>!x._cur);const d=new Date();p.episodes.push({date:d.toLocaleDateString('ar-SA-u-ca-gregory-nu-latn',{month:'long',year:'numeric'}),cause:c,signs:signs||'—',_cur:true});
  addTL(p,'الخروج: حُفظت النوبة في الذاكرة - '+c);save();toast('حُفظت النوبة، وتظهر في المرة القادمة إذا تكررت العلامات');rr()}
function discharge(){const p=byMrn(U.nurse);(p.episodes||[]).forEach(e=>delete e._cur);p.v=emptyVisit();save();toast('انتهت الزيارة · خرج المريض');U.step=1;rr()}
function closeVisit(){U.nurse=null;U.step=1;rr()}

/* ================= لوحة التحكم ================= */
function vDash(){
  const now=Date.now();
  const rows=S.patients.map(p=>({p,s:status(p),e:evalCmp(p.v.cmp)})).sort((a,b)=>a.s.o-b.s.o||((a.p.v.due||9e15)-(b.p.v.due||9e15)));
  const alerts=[];
  rows.forEach(({p,s,e})=>{const v=p.v,tag=`<b>${esc(p.name)} · سرير ${p.bed}:</b> `;
    if(!p.card){alerts.push(['gray',tag+'مريض جديد بلا بطاقة - أُرسلت أسئلة المرافق الأربعة']);return}
    const h=v.history;if(h.length>=2&&h.at(-1).c>h.at(-2).c)alerts.push(['red',tag+`تغير يزداد: من ${h.at(-2).c===1?'مجال':h.at(-2).c+' مجالات'} إلى ${h.at(-1).c} بين تقييمين - احتمال تدهور`]);
    else if(s.c==='red'&&e.mt.length&&!v.reassessed)alerts.push(['red',tag+'تغير يطابق علامة ألم معروفة عنه - احتمال ألم']);
    if(v.due&&v.due<=now)alerts.push(['amber',tag+'إعادة التقييم مستحقة منذ '+hm(v.due)]);
    if(v.reassessed){const r=reassessResult(p);if(r&&r.c!=='green')alerts.push(['amber',tag+r.t+' · '+r.x])}
    if(!v.cmpSaved&&!v.closed)alerts.push(['violet',tag+''+(now-v.arrived>15*MIN?'لم يُقيّم بعد - افتحيه لبدء المقارنة':'وصل للطوارئ - بانتظار المقارنة السريعة')]);
    if(monthsSince(p.card.updated)>=6)alerts.push(['gray',tag+`لم تُحدّث بطاقتها منذ ${monthsSince(p.card.updated)} أشهر - أُرسل طلب تحديث للأسرة`]);
  });
  const sel=byMrn(U.dashSel)||rows[0].p;
  const k={card:S.patients.filter(p=>p.card).length,red:rows.filter(r=>r.s.c==='red').length,due:S.patients.filter(p=>p.v.due&&p.v.due<=now).length,none:S.patients.filter(p=>!p.card).length};
  const t=U.dashTab;
  const table=`<div class="card" style="padding:0;overflow-x:auto"><h3 style="padding:14px 16px 0">المرضى مرتبين حسب الأولوية</h3><table class="dtable"><thead><tr><th>الحالة</th><th>المريض</th><th>السرير</th><th>المجالات المتغيرة</th><th>آخر تقييم</th><th>إعادة التقييم</th></tr></thead><tbody>
    ${rows.map(({p,s,e})=>{const last=p.v.reassessed||p.v.cmpSaved;const due=p.v.due;return `<tr class="click ${p.mrn===sel.mrn?'sel':''}" onclick="U.dashSel='${p.mrn}';rr()" ondblclick="openNurse('${p.mrn}',${p.v.cmpSaved?5:1})">
      <td><span class="pill p-${s.c}">${s.t}</span></td><td><b>${esc(p.name)}</b><div class="note">${p.age} سنة</div></td><td>${p.bed}</td>
      <td>${p.v.cmpSaved?(e.ch.length?`${e.ch.length} - ${e.ch.map(d=>d[1]).join('، ')}`:'0'):'—'}</td><td>${hm(last)}</td><td>${due?`<span class="${due<=now?'due-late':''}">${hm(due)}</span>`:'—'}</td></tr>`}).join('')}
    </tbody></table><p class="note" style="padding:8px 16px">اضغطي صفًا لعرض منحناه، وضغطتين لفتحه في واجهة الممرض.</p></div>`;
  const chart=`<div class="card"><h3>منحنى التغير - ${esc(sel.name)}</h3>${lineChart(sel.v.history)}<p class="note" style="margin:4px 0 0">عدد المجالات المتغيرة عن المعتاد (من 7) عبر الوقت. ${trendNote(sel.v.history)}</p></div>`;
  const al=`<div class="card"><h3>التنبيهات الذكية</h3>${alerts.map(a=>`<div class="alert ${a[0]}">${a[1]}</div>`).join('')||'<p class="note">لا توجد تنبيهات.</p>'}<p class="note">تنبيهات بقواعد واضحة. تنبّه ولا تشخّص.</p></div>`;
  const reports=`<div class="card"><h3>التقارير</h3><dl class="kv"><dt>متوسط وقت المقارنة</dt><dd>${avgCmp()}</dd><dt>تقييمات اليوم</dt><dd>${S.patients.filter(p=>p.v.cmpSaved).length}</dd><dt>إعادات تقييم مكتملة</dt><dd>${S.patients.filter(p=>p.v.reassessed).length}</dd><dt>نوبات محفوظة في الذاكرة</dt><dd>${S.patients.reduce((a,p)=>a+(p.episodes||[]).length,0)}</dd><dt>بطاقات قديمة (6 أشهر+)</dt><dd>${S.patients.filter(p=>p.card&&monthsSince(p.card.updated)>=6).length}</dd></dl></div>`;
  const body= t==='patients'?table : t==='alerts'?al : t==='reports'?reports :
   `<div class="grid g4" style="margin-bottom:14px">
     <div class="card kpi"><span class="note">مرضى لديهم بطاقة بصمة</span><b>${k.card}</b></div>
     <div class="card kpi red"><span class="note">تنبيهات حمراء</span><b>${k.red}</b></div>
     <div class="card kpi amber"><span class="note">إعادة تقييم مستحقة</span><b>${k.due}</b></div>
     <div class="card kpi"><span class="note">مرضى بدون بطاقة</span><b>${k.none}</b></div></div>
    <div class="split">${table}<div class="grid">${chart}${al}</div></div>`;
  $('#app').innerHTML=`<div class="row"><div><h1>لوحة التحكم الذكية · قسم الطوارئ</h1><p class="muted" style="margin:0">اضغطي على أي مريض لعرض منحنى التغير. الترتيب: الأحمر أولًا، ثم من حان وقت إعادة تقييمه، ثم الأصفر، ثم الأخضر.</p></div><span class="sp"></span><span class="note">${new Date().toLocaleDateString('ar-SA-u-ca-gregory-nu-latn',{weekday:'long',day:'numeric',month:'long'})} · ${hm(now)}</span></div>
  <div class="dash" style="margin-top:14px"><aside><div style="color:#fff;font-weight:700;padding:4px 10px 12px">بصمة</div>
    ${[['all','لوحة التحكم'],['patients','المرضى'],['alerts','التنبيهات'],['reports','التقارير']].map(([key,l])=>`<a class="${t===key?'on':''}" onclick="U.dashTab='${key}';rr()">${l}${key==='alerts'&&alerts.length?`<span class="n">${alerts.length}</span>`:''}</a>`).join('')}</aside>
  <div class="in">${body}</div></div>`;
}
function avgCmp(){const xs=S.patients.map(p=>p.v.cmpSecs).filter(x=>x!=null);return xs.length?fmtSecs(Math.round(xs.reduce((a,b)=>a+b,0)/xs.length))+' دقيقة':'—'}
function trendNote(h){if(h.length<2)return '';const d=h.at(-1).c-h.at(-2).c;return d>0?'<b style="color:var(--red)">يسوء: زادت المجالات المتغيرة.</b>':d<0?'<b style="color:var(--green)">يتحسن.</b>':'ثابت.'}
function lineChart(h){
  if(!h.length)return '<p class="note">لا توجد تقييمات بعد.</p>';
  const W=320,H=150,pl=26,pr=10,pt=10,pb=24,n=h.length;
  const x=i=>n===1?(W+pl-pr)/2:pl+(W-pl-pr)*i/(n-1), y=c=>pt+(H-pt-pb)*(1-c/7);
  const last=h.at(-1).c,col=n>1&&last>h.at(-2).c?'#c8453b':n>1&&last<h.at(-2).c?'#2f8f5b':'#0f6b63';
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;direction:ltr">${[0,2,4,6].map(c=>`<line x1="${pl}" x2="${W-pr}" y1="${y(c)}" y2="${y(c)}" stroke="#e6eceb"/><text x="${pl-6}" y="${y(c)+4}" font-size="10" text-anchor="end" fill="#8a9a98">${c}</text>`).join('')}
   <polyline fill="none" stroke="${col}" stroke-width="2.5" points="${h.map((p,i)=>x(i)+','+y(p.c)).join(' ')}"/>
   ${h.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.c)}" r="4" fill="#fff" stroke="${col}" stroke-width="2"/><text x="${x(i)}" y="${y(p.c)-8}" font-size="10" text-anchor="middle" fill="${col}">${p.c}</text><text x="${x(i)}" y="${H-6}" font-size="10" text-anchor="middle" fill="#8a9a98">${hm(p.t)}</text>`).join('')}</svg>`;
}

/* ================= ملخص الطبيب ================= */
function docText(p){
  const c=p.card,v=p.v,e=evalCmp(v.cmp),sc=recScale(p),A=autoOpq(p),r=reassessResult(p);
  const L=[`ملخص بصمة للطبيب · ${p.name} (افتراضي) · ${p.age} سنة · ملف ${p.mrn} · سرير ${p.bed}`,`التشخيص: ${p.dx}`];
  if(!c){L.push('لا توجد بطاقة بصمة.');return L.join('\n')}
  L.push(`الخلفية: ${c.med.cond||'غير متوفرة'} · الحساسية: ${c.med.allergy||'غير متوفرة'}${c.med.recur?' · '+c.med.recur:''}`);
  L.push(`التواصل: ${c.comm.speaks?'يتكلم':'لا يتكلم'} · كيف أتعامل معه: ${[c.handle.beforeTouch,c.handle.comfort].filter(Boolean).join('، ')||'غير متوفر'}`);
  if(p.diarySum)L.push('اليوميات: '+p.diarySum);
  L.push(`المقارنة بخط الأساس: ${e.t}${e.ch.length?' · '+e.ch.map(([k,t])=>`${t}: «${c.base[k]||'—'}» ← «${v.cmp[k].n||'متغير'}»${v.cmp[k].m?' (علامة ألم معروفة)':''}`).join(' | '):''}`);
  L.push(`تقييم الألم: الموقع ${A.loc[0]||'—'} · الشدة ${A.sev[0]||'—'}`);
  if(v.hidden.length)L.push('الأسباب الخفية المقترحة للفحص: '+v.hidden.join('، '));
  if(v.interv)L.push(`المتابعة: ${v.interv.x} ${hm(v.interv.t)}${r?' · '+r.t:''}`);
  if(v.finalCause)L.push('السبب النهائي: '+v.finalCause);
  L.push('تنبيه: بصمة تنبّه ولا تشخّص، والقرار للفريق الصحي.');
  return L.join('\n');
}

   <h3>الأسباب الخفية المقترحة للفحص</h3>${v.hidden.length?`<ul style="margin:0">${v.hidden.map(h=>`<li>${esc(h)}</li>`).join('')}</ul>`:'<p class="note" style="margin:0">لم يُحدد سبب بعد.</p>'}
   <h3>المتابعة</h3><p style="margin:0">${v.interv?esc(v.interv.x)+' الساعة '+hm(v.interv.t)+'.':'لم يُسجّل تدخل.'} ${r?'إعادة التقييم: '+r.t+'.':''} ${v.finalCause?'السبب النهائي: '+esc(v.finalCause)+'.':''}</p>

   <p class="note" style="margin-top:16px;border-top:1px solid var(--line);padding-top:10px">بصمة تنبّه ولا تشخّص. القرار للطبيب والفريق الصحي.</p></div>`;

/* ================= الذكاء الاصطناعي ================= */
const AUS=[['brow','تقطيب الحاجب'],['eye','إغماض العين بقوة'],['lip','رفع الشفة العليا'],['mouth','فتح الفم']];
const AI_BASE={brow:.1,eye:.08,lip:.05,mouth:.12}, AI_NOW={brow:.72,eye:.81,lip:.46,mouth:.22};
function aiFace(a){const b=a.brow,e=a.eye,l=a.lip,m=a.mouth;
  return `<svg viewBox="0 0 200 240" width="220"><ellipse cx="100" cy="122" rx="74" ry="96" fill="#e9c4a0" stroke="#b98c66" stroke-width="2"/>

   <ellipse cx="74" cy="108" rx="13" ry="${Math.max(1.5,7*(1-e))}" fill="#2b1a12"/><ellipse cx="126" cy="108" rx="13" ry="${Math.max(1.5,7*(1-e))}" fill="#2b1a12"/>
   ${e>.4?'<path d="M60 102 L68 106 M140 102 L132 106" stroke="#8a5a3c" stroke-width="2"/>':''}
   ${[[55,88+b*8],[92,90+b*10],[108,90+b*10],[145,88+b*8],[61,108],[87,108],[113,108],[139,108],[76,172-l*8],[124,172-l*8],[100,166-l*10]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="3.5" fill="#5fc4b6"/>`).join('')}<path d="M100 118 L94 148 L106 148" stroke="#b98c66" stroke-width="2.5" fill="none"/>
   <path d="M76 ${172-l*8} Q100 ${172-l*14-(m*6)} 124 ${172-l*8}" stroke="#7a3a2c" stroke-width="4" fill="none" stroke-linecap="round"/>
   <path d="M78 ${174} Q100 ${b>.4?168+m*28:182+m*20} 122 174" stroke="#7a3a2c" stroke-width="4" fill="${m>.15?'#5a2420':'none'}" stroke-linecap="round"/></svg>`}

  <div class="split2" style="margin-top:14px">

      <div class="row note"><span>▬ المعتاد عنده</span><span style="color:var(--red)">▬ الآن</span></div>
      ${AUS.map(([k,l])=>`<div style="margin:12px 0"><div class="row"><b style="font-size:14px">${l}</b><span class="sp"></span><span class="note">${A.mode==='now'?(Math.round(now[k]*100)+'٪ مقابل '+Math.round(AI_BASE[k]*100)+'٪'):'—'}</span></div>
        <div class="bar" style="margin-top:4px"><span style="width:${AI_BASE[k]*100}%;background:#9fb6b2"></span></div>${A.mode==='now'?`<div class="bar" style="margin-top:3px"><span style="width:${now[k]*100}%;background:var(--red)"></span></div>`:''}</div>`).join('')}
      <div class="res ${A.done?'amber':'gray'}" style="margin-top:10px">${A.done?`<b class="t">مؤشر إضافي: تغير في ${changed} من 4 حركات عن وجهه المعتاد</b><div style="font-size:14px">يتوافق مع علامة ألم معروفة عنه في البطاقة (يغمض عينيه بقوة). يُضاف إلى المقارنة السريعة ولا يحل محلها.</div>`:A.run>0?`جارٍ التحليل… ${Math.round(A.run*100)}٪`:'اضغطي «تحليل مقطع 10 ثوانٍ» لمقارنة وجه سعد الآن بفيديو البصمة.'}</div>
      <div class="card" style="margin-top:12px;background:#f7faf9"><b>ضوابط:</b> <span class="note">نتيجة الذكاء الاصطناعي مؤشر إضافي، يظهر بجانب المقارنة السريعة، ولا يُغيّر لون التنبيه وحده. لا يُرسل فيديو ولا يُحفظ إلا بموافقة الأسرة، ولا يُستخدم للتشخيص. هذا عرض توضيحي ببيانات افتراضية، ولا يحلل وجهًا حقيقيًا.</span></div>
      <p class="note">مرحلة مستقبلية في خارطة الطريق (المرحلة 5).</p></div></div>`;
}
function runAI(){U.ai={mode:'now',run:.01,done:false};rr();const h=setInterval(()=>{U.ai.run=Math.min(1,U.ai.run+.08);if(U.ai.run>=1){clearInterval(h);U.ai.done=true;const p=byMrn('10482');if(p&&!p.v.tl.find(t=>t.x.startsWith('الذكاء')))addTL(p,'الذكاء الاصطناعي: تغير في 3 من 4 حركات وجه عن فيديو البصمة (مؤشر إضافي)');save()}if(location.hash==='#ai')rr()},160)}

/* ================= FHIR ================= */
function fhirBundle(p){
  const c=p.card||emptyCard(),v=p.v,e=evalCmp(v.cmp),sc=recScale(p),pid='demo-'+p.mrn,ref={reference:'Patient/'+pid};
  const iso=t=>t?new Date(t).toISOString():undefined, entry=[];
  entry.push({resource:{resourceType:'Patient',id:pid,identifier:[{system:'urn:demo:hospital-mrn',value:p.mrn}],name:[{given:[p.name]}],gender:p.sex==='أنثى'?'female':'male'}});
  entry.push({resource:{resourceType:'QuestionnaireResponse',id:'basma-card-'+p.mrn,questionnaire:'Questionnaire/basma-card',status:'completed',subject:ref,authored:iso(c.updated),source:{display:c.by||'الأسرة'},
    item:[{linkId:'communication',text:'طريقة التواصل',answer:[{valueString:(c.comm.speaks?'يتكلم':'لا يتكلم')+(c.comm.refuse?'. '+c.comm.refuse:'')}]},{linkId:'pain-signs',text:'علامات الألم الخاصة به',answer:[...c.pain,c.painOther].filter(Boolean).map(x=>({valueString:x}))},
      {linkId:'baseline',text:'السلوك المعتاد',item:DOM.map(([k,t])=>({linkId:'baseline-'+k,text:t,answer:[{valueString:c.base[k]||''}]}))},{linkId:'handling',text:'كيف أتعامل معه',answer:[{valueString:[c.handle.upset,c.handle.beforeTouch,c.handle.comfort].filter(Boolean).join(' · ')}]}]}});
  if(v.cmpSaved)entry.push({resource:{resourceType:'Observation',id:'basma-comparison-'+p.mrn,status:'final',code:{text:'مقارنة بصمة بخط الأساس'},subject:ref,effectiveDateTime:iso(v.cmpSaved),valueString:e.t,component:e.ch.map(([k,t])=>({code:{text:t},valueString:v.cmp[k].n||'متغير'}))}});
  if(v.score!=='')entry.push({resource:{resourceType:'Observation',id:'basma-pain-score-'+p.mrn,status:'final',code:{text:sc.full+' ('+sc.name+')'},subject:ref,effectiveDateTime:iso(v.painSaved),valueQuantity:{value:+v.score},bodySite:v.board.loc.length?{text:locNames(v.board).join('، ')}:undefined}});
  if(v.finalCause)entry.push({resource:{resourceType:'Condition',id:'basma-episode-'+p.mrn,clinicalStatus:{text:'resolved'},code:{text:v.finalCause},subject:ref,note:[{text:'سبب النوبة النهائي بعد مراجعة الطبيب'}]}});
  if(v.interv)entry.push({resource:{resourceType:'MedicationAdministration',id:'basma-med-'+p.mrn,status:'completed',medicationCodeableConcept:{text:v.interv.x},subject:ref,effectiveDateTime:iso(v.interv.t)}});
  entry.push({resource:{resourceType:'Provenance',id:'basma-prov-'+p.mrn,target:[{reference:'QuestionnaireResponse/basma-card-'+p.mrn}],recorded:iso(c.updated||Date.now()),agent:[{who:{display:c.by||'الأسرة'}}]}});
  return JSON.stringify({resourceType:'Bundle',type:'collection',entry},null,2);
}
function vFhir(){
  const p=byMrn(U.fhir)||S.patients[0];
  const opts=S.patients.map(x=>`<option value="${x.mrn}" ${x.mrn===p.mrn?'selected':''}>${esc(x.name)} · ${x.mrn}</option>`).join('');
  const map=[['بيانات المريض الأساسية','Patient'],['بطاقة البصمة واليوميات وإجابات المقارنة','QuestionnaireResponse'],['درجة مقياس الألم ونتيجة المقارنة','Observation'],['السبب النهائي للنوبة','Condition'],['إعطاء المسكن','MedicationAdministration'],['مصدر كل معلومة','Provenance']];
  $('#app').innerHTML=`<div class="row"><div><h1>الربط مع الملف الصحي</h1><p class="muted" style="margin:0">تعمل بصمة من داخل نظام المستشفى، وتُحفظ بياناتها بمعيار HL7 FHIR. هذا ملف البيانات الذي يُبنى من تقييم المريض الآن.</p></div><span class="sp"></span><select style="width:auto" onchange="U.fhir=this.value;rr()">${opts}</select><button class="btn ghost" onclick="copyText(fhirBundle(byMrn(U.fhir)||S.patients[0]),'نُسخ ملف البيانات')">نسخ الملف</button></div>
  <div class="split2" style="margin-top:14px">
    <div class="grid"><div class="card" style="padding:0"><table><thead><tr><th>بيانات بصمة</th><th>طريقة حفظها</th></tr></thead><tbody>${map.map(([a,b])=>`<tr><td>${a}</td><td style="direction:ltr;text-align:right;font-family:ui-monospace,monospace;font-size:13px">${b}</td></tr>`).join('')}</tbody></table></div>
      <div class="card"><b>كيف يصل الممرض إلى البطاقة؟</b><p class="note" style="margin:4px 0 0">يدخل رقم الهوية أو رقم الملف، فتظهر البطاقة واليوميات كجزء من ملف المريض دون تسجيل دخول إضافي. ولا تحتاج الأسرة إلى تطبيق: تعبّئ البطاقة من رابط آمن تصلها برسالة نصية، ويُسجَّل من أنشأها ومن اطلع عليها ومتى.</p></div>
      <div class="card"><p class="note" style="margin:0">مستقبلًا: بعد الموافقات والاعتماد، يمكن أن تنتقل بطاقة البصمة بين المستشفيات عبر منصة التبادل الوطني للمعلومات الصحية (SeHE). النموذج لا يتصل بأي نظام حقيقي.</p></div></div>
    <pre class="code">${esc(fhirBundle(p))}</pre></div>`;
}

route();
</script>
